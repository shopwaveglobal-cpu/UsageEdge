name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and run automated checks
        run: bash build.sh
      - name: Verify local HTTP integration
        run: python3 Tests/Integration/kimi_http.py "$(xcrun --show-sdk-path)"
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell syntax and quota calculation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem Windows -Filter '*.ps1' | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
          $testName = -join ([char]0xAC80, [char]0xC0AC)
          & (Join-Path Windows ($testName + ".ps1"))
      - name: Verify Windows Kimi local HTTP
        run: python Tests/Integration/windows_kimi_http.py
      - name: Exercise Windows form
        shell: powershell
        run: powershell.exe -NoProfile -STA -File Windows/UITest.ps1
